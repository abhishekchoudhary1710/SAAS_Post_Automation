name: Social growth scorecard

on:
  schedule:
    - cron: "30 17 * * *" # Daily after the final 21:37 IST post
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scorecard from publication receipts and measured snapshots
        run: |
          python3 tools/growth_scorecard.py
          cat out/growth-scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: growth-scorecard-${{ github.run_id }}
          path: out/growth-scorecard.md
          retention-days: 30
