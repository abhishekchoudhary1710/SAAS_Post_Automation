name: LinkedIn product growth

# The VM timers in tools/systemd dispatch each slot on time; these crons are the late-prone backup.
on:
  schedule:
    - cron: "47 11 * * 1" # 17:17 IST Mon, midday
    - cron: "47 10 * * 2" # 16:17 IST Tue, midday
    - cron: "47 10 * * 3" # 16:17 IST Wed, midday
    - cron: "47 11 * * 4" # 17:17 IST Thu, midday
    - cron: "47 9 * * 5" # 15:17 IST Fri, midday
    - cron: "47 3 * * 6" # 09:17 IST Sat, midday
    - cron: "47 0 * * 0" # 06:17 IST Sun, midday
    - cron: "47 16 * * 1" # 22:17 IST Mon, evening
    - cron: "47 16 * * 2" # 22:17 IST Tue, evening
    - cron: "47 13 * * 3" # 19:17 IST Wed, evening
    - cron: "47 15 * * 4" # 21:17 IST Thu, evening
    - cron: "47 11 * * 5" # 17:17 IST Fri, evening
    - cron: "47 12 * * 6" # 18:17 IST Sat, evening
    - cron: "47 16 * * 0" # 22:17 IST Sun, evening
    - cron: "17 18 * * *" # 23:47 IST daily publication and analytics check
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, publish, report]
        default: preview
        description: "Preview renders two weeks without posting; publish runs today's selected slot"
      slot:
        type: choice
        options: [midday, evening, extra]
        default: midday
        description: "Slot for manual publication; midday means the first daily slot, extra posts one more job list now"

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  linkedin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_KEY_EXPIRES: ${{ vars.BUFFER_KEY_EXPIRES }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      # The existing public repository hosts these files on a separate linkedin-media branch.
      # This keeps asynchronous Buffer downloads separate from the many daily reel uploads.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Test LinkedIn content and publication guards
        run: python -m unittest discover -s tests -p 'test_linkedin*.py' -v
      - name: Preview two weeks without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: python -m agent.linkedin_growth preview --out out/linkedin-preview
      - name: Prepare today's product post
        id: prepare
        if: (github.event_name == 'schedule' && github.event.schedule != '17 18 * * *') || inputs.mode == 'publish'
        env:
          POST_SLOT: ${{ inputs.slot || 'midday' }}
          POST_SCHEDULE: ${{ github.event.schedule }}
        run: python -m agent.linkedin_growth prepare --slot "$POST_SLOT" --schedule "$POST_SCHEDULE"
      - name: Save reservation before calling Buffer
        if: steps.prepare.outputs.ready == 'true'
        run: bash tools/save_linkedin_state.sh
      - name: Submit the reserved post to Buffer
        if: steps.prepare.outputs.ready == 'true'
        run: python -m agent.linkedin_growth publish
      - name: Read publication status and available metrics
        if: always() && (github.event_name == 'schedule' || inputs.mode != 'preview')
        run: |
          python -m agent.linkedin_growth report
          cat out/linkedin-current/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save publication receipts and metrics
        if: always() && (github.event_name == 'schedule' || inputs.mode != 'preview')
        run: bash tools/save_linkedin_state.sh
      - name: Retain captions, media, and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/linkedin-*/**
            content/linkedin_growth.json
          retention-days: 30
