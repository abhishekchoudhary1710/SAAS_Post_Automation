name: Post to social

# The title each run shows in the Actions list. Runs started by the outside scheduler are titled
# after their slot ("Post to social: evening"), which is how tools/slot_already_posted.py finds
# them. Dry runs add "(dry run)" and so never count as a posted slot.
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.slot != 'manual' && format('Post to social: {0}{1}', inputs.slot, inputs.dry_run && ' (dry run)' || '') || github.workflow }}"

on:
  schedule:
    # Eight daily slots, allocated 3 Live Sarthi / 3 Prep / 2 Apply since 24 Sep 2026.
    # Live Sarthi (the Windows app, sold as Interview Sarthi in the Store) is the only one of
    # the three with paying customers, so it gets three slots spread across the day rather
    # than the two it was cut to on 23 Sep.
    #   09:07 IST morning          Apply carousel       "37 3 * * *"
    #   10:37 IST late-morning     Live sales reel      "7 5 * * *"
    #   12:37 IST midday           Prep reel            "7 7 * * *"
    #   14:37 IST early-afternoon  Prep reel            "7 9 * * *"
    #   16:37 IST afternoon        Live sales reel      "7 11 * * *"
    #   18:07 IST early-evening    Apply carousel       "37 12 * * *"
    #   19:37 IST evening          Live, format by day  "7 14 * * *"
    #   21:37 IST night            Prep reel            "7 16 * * *"
    # Carousels go to Instagram/Facebook; the five videos also go to YouTube.
    #
    # On time vs backup (15 Sep 2026): GitHub started scheduled runs 3 to 7 hours late, so
    # cron-job.org starts each slot on time through workflow_dispatch with `slot` set. These crons
    # stay as a backup: when one finally fires, the guard job skips it if the outside run of that
    # slot succeeded or is still going, and posts if it failed or never came.
    - cron: "37 3 * * *"
    - cron: "7 5 * * *"
    - cron: "7 7 * * *"
    - cron: "7 9 * * *"
    - cron: "7 11 * * *"
    - cron: "37 12 * * *"
    - cron: "7 14 * * *"
    - cron: "7 16 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Daily slot (the outside scheduler sets this; leave manual for a one-off post)"
        type: choice
        options: [manual, morning, late-morning, midday, early-afternoon, afternoon, early-evening, evening, night]
        default: manual
      format:
        description: "Post format (manual only; a named slot picks its own)"
        type: choice
        options: [auto, sales, demo, film, reel, carousel, image]
        default: auto
      variant:
        description: "Sales reel length (manual only)"
        type: choice
        options: [auto, short, standard]
        default: auto
      topic:
        description: "Steer today's topic (optional)"
        type: string
        default: ""
      platforms:
        description: "Comma list of platforms"
        type: string
        default: "instagram,facebook,youtube"
      dry_run:
        description: "Create everything, publish nothing (a Veo opening is still generated and billed)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: read   # the guard job lists this workflow's recent runs

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # tools for the guard script; content for history.json, which shows whether a failed
          # outside run still published to some platforms
          sparse-checkout: |
            tools
            content

      - name: Work out the slot
        id: slot
        run: |
          SLOT="${{ inputs.slot || 'manual' }}"
          case "${{ github.event.schedule }}" in
            "37 3 * * *")  SLOT="morning" ;;
            "7 5 * * *")   SLOT="late-morning" ;;
            "7 7 * * *")   SLOT="midday" ;;
            "7 9 * * *")   SLOT="early-afternoon" ;;
            "7 11 * * *")  SLOT="afternoon" ;;
            "37 12 * * *") SLOT="early-evening" ;;
            "7 14 * * *")  SLOT="evening" ;;
            "7 16 * * *")  SLOT="night" ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "slot: $SLOT (trigger: ${{ github.event_name }} ${{ github.event.schedule }})"

      - name: Skip if the outside scheduler already posted this slot
        id: check
        if: github.event_name == 'schedule'
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/slot_already_posted.py

  post:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/257182832897/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: veo-au-541@uniyal-video.iam.gserviceaccount.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          ffmpeg -version | head -1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run the agent
        env:
          SLOT: ${{ needs.guard.outputs.slot }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          SCRIPT_MODELS: ${{ vars.SCRIPT_MODELS || 'gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash' }}
          # Full Veo films and the old card-reel hook stay off (owner verdict, 12 Sep 2026).
          VEO_ENABLED: "false"
          # A fresh Veo opening scene for every sales reel, from the free-trial credit on the
          # uniyal-video project (moved off video-generation-uniyal on 17 Sep 2026; the start date
          # resets so earlier seconds do not count against the new credit).
          # Veo 3.1 Fast, 8 s at 720p, about $0.80 a reel. Caps in seconds: 1500 a month (about $150),
          # 2600 in total from VEO_OPENING_START (about $260). Past a cap, or on any Veo error, the reel
          # opens on a library clip instead. See agent/render/veo_opening.py.
          VEO_OPENING_ENABLED: "true"
          VEO_OPENING_MODEL: veo-3.1-fast-generate-001
          VEO_OPENING_MONTHLY_SECONDS: "1500"
          VEO_OPENING_TOTAL_SECONDS: "2600"
          VEO_OPENING_START: "2026-09-17"
          GOOGLE_CLOUD_PROJECT: uniyal-video
          GOOGLE_CLOUD_LOCATION: global
          VEO_MODEL: veo-3.1-lite-generate-001
          VEO_STORY_MODEL: veo-3.1-generate-001
          VEO_RESOLUTION: 1080p
          VEO_AUDIO: "false"
          VEO_MAX_SECONDS_PER_RUN: "24"
          VEO_MONTHLY_SECONDS: "600"
          VEO_SECONDS: "4"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          POST_TOPIC: ${{ inputs.topic }}
          PLATFORMS: ${{ inputs.platforms || 'instagram,facebook,youtube' }}
        run: |
          FORMAT="${{ inputs.format || 'auto' }}"
          VARIANT="${{ inputs.variant || 'auto' }}"
          # Keep the eight existing times; three go to the Windows app (Live Sarthi),
          # three to Prep and two to Apply. Prep/Apply use reel/carousel renderers,
          # since sales/image renderers are specific to the Windows app -- which is
          # also why a "sales" slot needs no --product: pipeline.run sends sales and
          # image straight to create_sales, which only knows the Windows app.
          # The evening slot picks its format from knowledge/schedule.json, so it is
          # the one Live slot that could drift onto another product's pillar. It is
          # pinned with --product instead.
          # A manual run keeps its requested format and variant.
          PRODUCT=""
          case "$SLOT" in
            morning)         FORMAT="carousel"; VARIANT="standard"; PRODUCT="apply_sarthi" ;;
            late-morning)    FORMAT="sales"; VARIANT="short" ;;
            midday)          FORMAT="reel";  VARIANT="standard"; PRODUCT="prep_sarthi" ;;
            early-afternoon) FORMAT="reel"; VARIANT="standard"; PRODUCT="prep_sarthi" ;;
            afternoon)       FORMAT="sales"; VARIANT="standard" ;;
            early-evening)   FORMAT="carousel"; VARIANT="standard"; PRODUCT="apply_sarthi" ;;
            evening)         FORMAT="auto";  VARIANT="standard"; PRODUCT="interview_sarthi" ;;
            night)           FORMAT="reel";  VARIANT="standard"; PRODUCT="prep_sarthi" ;;
          esac
          PRODUCT_ARG=""
          [ -n "$PRODUCT" ] && PRODUCT_ARG="--product $PRODUCT"
          echo "format: $FORMAT variant: $VARIANT product: ${PRODUCT:-interview_sarthi} (slot: $SLOT, trigger: ${{ github.event_name }})"
          python -m unittest discover -s tests -v
          python -m agent run --format "$FORMAT" --variant "$VARIANT" $PRODUCT_ARG --topic "$POST_TOPIC"

      - name: Keep the outputs for two weeks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: |
            out/**/post.json
            out/**/published.json
            out/**/quality.json
            out/**/evidence.json
            out/**/cover.jpg
            out/*/reel.mp4
            out/*/poster.jpg
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "sarthi-social-agent"
          git config user.email "actions@users.noreply.github.com"
          git add content/history.json
          if [ -f content/performance.json ]; then git add content/performance.json; fi
          if git diff --cached --quiet; then
            echo "history unchanged"
          else
            git commit -m "history: $(date -u +%Y-%m-%d) run ${{ github.run_id }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
