name: Post to social

on:
  schedule:
    # Four posts a day, every day, in IST (GitHub cron is UTC; the odd minutes avoid the busy
    # :00 slot, where runners queue and a schedule can be dropped altogether).
    # 09:07 IST: one still card. Instagram and Facebook only, so it costs no YouTube quota.
    # 12:37 IST: the shorter sales demonstration on all three platforms.
    # 16:37 IST: the card reel, on all three platforms. Not the film: film needs Veo footage and
    #            the scheduled path runs with VEO_ENABLED=false, so it would degrade to a card reel anyway.
    # 19:37 IST: the day's video, whichever format knowledge/schedule.json names for the weekday.
    # The run step maps each cron to its format.
    # Owner decision, 13 Sep 2026: raised from two a day to four. Social is the only channel that
    # has moved the numbers (20 users to 225 in a fortnight on twelve posts), so volume is the lever.
    # YouTube allows six uploads a day (1,600 units of 10,000 each); three of these four slots
    # upload, which is 4,800 units and leaves room for a manual run.
    - cron: "37 3 * * *"
    - cron: "7 7 * * *"
    - cron: "7 11 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "Post format"
        type: choice
        options: [auto, sales, demo, film, reel, carousel, image]
        default: auto
      topic:
        description: "Steer today's topic (optional)"
        type: string
        default: ""
      platforms:
        description: "Comma list of platforms"
        type: string
        default: "instagram,facebook,youtube"
      dry_run:
        description: "Create everything, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/794971229840/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: veo-automation@video-generation-uniyal.iam.gserviceaccount.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          ffmpeg -version | head -1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run the agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          SCRIPT_MODELS: ${{ vars.SCRIPT_MODELS || 'gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash' }}
          VEO_ENABLED: "false"
          GOOGLE_CLOUD_PROJECT: video-generation-uniyal
          GOOGLE_CLOUD_LOCATION: global
          VEO_MODEL: veo-3.1-lite-generate-001
          VEO_STORY_MODEL: veo-3.1-generate-001
          VEO_RESOLUTION: 1080p
          VEO_AUDIO: "false"
          VEO_MAX_SECONDS_PER_RUN: "24"
          VEO_MONTHLY_SECONDS: "600"
          VEO_SECONDS: "4"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          POST_TOPIC: ${{ inputs.topic }}
          PLATFORMS: ${{ inputs.platforms || 'instagram,facebook,youtube' }}
        run: |
          FORMAT="${{ inputs.format || 'auto' }}"
          VARIANT="auto"
          # Each cron maps to its own format so the feed is not four of the same video a day.
          # The evening cron keeps "auto" and so follows knowledge/schedule.json for the weekday.
          # Platform choice is NOT set here: knowledge/schedule.json platforms_by_format already
          # keeps the image slot off YouTube.
          if [ "${{ github.event.schedule }}" = "37 3 * * *" ]; then FORMAT="image";  VARIANT="short"; fi
          if [ "${{ github.event.schedule }}" = "7 7 * * *" ];  then FORMAT="sales";  VARIANT="short"; fi
          if [ "${{ github.event.schedule }}" = "7 11 * * *" ]; then FORMAT="reel";   VARIANT="standard"; fi
          if [ "${{ github.event.schedule }}" = "7 14 * * *" ]; then VARIANT="standard"; fi
          echo "format: $FORMAT (trigger: ${{ github.event_name }} ${{ github.event.schedule }})"
          python -m unittest discover -s tests -v
          python -m agent run --format "$FORMAT" --variant "$VARIANT" --topic "$POST_TOPIC"

      - name: Keep the outputs for two weeks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "sarthi-social-agent"
          git config user.email "actions@users.noreply.github.com"
          git add content/history.json
          if [ -f content/performance.json ]; then git add content/performance.json; fi
          if git diff --cached --quiet; then
            echo "history unchanged"
          else
            git commit -m "history: $(date -u +%Y-%m-%d) run ${{ github.run_id }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
