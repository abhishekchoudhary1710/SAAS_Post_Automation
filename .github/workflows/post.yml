name: Post to social

on:
  schedule:
    # 19:37 IST on Mon, Tue, Wed, Fri, Sat (GitHub cron is UTC; the odd minute avoids the busy :00 slot).
    # Five a week: 3 reels, 1 carousel, 1 image. Thursday and Sunday are deliberate rest days.
    # Which FORMAT each day gets is knowledge/schedule.json. Daily instead: "7 14 * * *".
    - cron: "7 14 * * 1,2,3,5,6"
  workflow_dispatch:
    inputs:
      format:
        description: "Post format"
        type: choice
        options: [auto, image, carousel, reel]
        default: auto
      topic:
        description: "Steer today's topic (optional)"
        type: string
        default: ""
      platforms:
        description: "Comma list of platforms"
        type: string
        default: "instagram,facebook,youtube"
      dry_run:
        description: "Create everything, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/794971229840/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: veo-automation@video-generation-uniyal.iam.gserviceaccount.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          ffmpeg -version | head -1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run the agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          VEO_ENABLED: "true"
          GOOGLE_CLOUD_PROJECT: video-generation-uniyal
          GOOGLE_CLOUD_LOCATION: global
          VEO_MODEL: veo-3.1-lite-generate-001
          VEO_SECONDS: "4"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLATFORMS: ${{ inputs.platforms || 'instagram,facebook,youtube' }}
        run: |
          python -m agent run --format "${{ inputs.format || 'auto' }}" --topic "${{ inputs.topic }}"

      - name: Keep the outputs for two weeks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "sarthi-social-agent"
          git config user.email "actions@users.noreply.github.com"
          git add content/history.json
          if git diff --cached --quiet; then
            echo "history unchanged"
          else
            git commit -m "history: $(date -u +%Y-%m-%d) run ${{ github.run_id }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
