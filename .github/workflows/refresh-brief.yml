name: Refresh business brief

on:
  schedule:
    - cron: "23 2 1 * *"   # 07:53 IST on the 1st of every month
  workflow_dispatch:
    inputs:
      url:
        description: "Website to read"
        type: string
        default: "https://interviewsarthi.com"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Read the website and rewrite the auto brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python -m agent research --url "${{ inputs.url || 'https://interviewsarthi.com' }}"
      - name: Commit
        run: |
          git config user.name "sarthi-social-agent"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/business_brief.auto.md
          git diff --cached --quiet || (git commit -m "brief: refreshed from the website $(date -u +%Y-%m-%d)" && git push)
