name: Veo full reel experiment

# Manual only. Experiments that need the Google Cloud identity: Veo brand films, and probes of
# the voice engines. Publishes nothing, ever, and is not part of the posting schedule.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [voice_probe, continuous_film]
        default: voice_probe

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/794971229840/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: veo-automation@video-generation-uniyal.iam.gserviceaccount.com

      - name: Make sure Text-to-Speech is enabled on the project
        continue-on-error: true
        run: |
          gcloud services enable texttospeech.googleapis.com --project=video-generation-uniyal 2>&1 | tail -3 || true
          gcloud services list --enabled --project=video-generation-uniyal 2>/dev/null | grep -E "texttospeech|aiplatform" || echo "(could not list services with this identity)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          ffmpeg -version | head -1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run the experiment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: video-generation-uniyal
          GOOGLE_CLOUD_LOCATION: global
          VEO_EXTEND_MODEL: veo-3.1-fast-generate-001
        run: |
          case "${{ inputs.task }}" in
            continuous_film) python tools/veo_continuous_film.py ;;
            *) python tools/voice_probe.py ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-${{ inputs.task }}
          path: |
            out/veo-continuous
            out/voice-probe
          retention-days: 14
          if-no-files-found: ignore
