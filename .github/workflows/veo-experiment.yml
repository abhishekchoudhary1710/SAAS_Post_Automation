name: Veo full reel experiment

# Manual only. Builds experimental brand films with Veo. Publishes nothing, ever,
# and is not part of the posting schedule.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/794971229840/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: veo-automation@video-generation-uniyal.iam.gserviceaccount.com

      - name: Probe Cloud Storage access (in case extension needs a gs:// path)
        continue-on-error: true
        run: |
          gcloud storage buckets list --project=video-generation-uniyal --format="value(name)" 2>&1 | head -5 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          ffmpeg -version | head -1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Build the continuous brand film
        env:
          GOOGLE_CLOUD_PROJECT: video-generation-uniyal
          GOOGLE_CLOUD_LOCATION: global
          VEO_EXTEND_MODEL: veo-3.1-fast-generate-preview
        run: python tools/veo_continuous_film.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veo-continuous
          path: out/veo-continuous
          retention-days: 14
